services:
  db:
    image: postgres:14.3
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_NAME}
    container_name: nexpensesdb
    volumes:
      - nexpenses-db-data:/var/lib/postgresql/data

volumes:
  nexpenses-db-data:
